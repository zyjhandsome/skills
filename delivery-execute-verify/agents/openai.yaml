interface:
  display_name: "Delivery Execute Verify"
  short_description: "Implement approved tasks with TDD and fresh verification"
  default_prompt: >
    Use $delivery-execute-verify for approved implementation and verification.
    Follow tasks.md test-first, preserve backflow semantics, run the applicable
    G1–G9 checks freshly before any verified claim, and never archive or mutate
    git without the separate authority required by the family contract.
