<!DOCTYPE html>
<html lang="zh-CN" data-theme="sepia" style="--rec-label: '★ 推荐'">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{{TITLE}}</title>
  <!-- Apply theme + font scale before first paint to avoid a flash/reflow -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("md2html-theme");
        // 浅色 and 墨水屏 were retired; keep readers who chose them on the nearest theme.
        saved = { light: "sepia", eink: "reader" }[saved] || saved;
        if (["sepia", "reader", "dark"].indexOf(saved) < 0) saved = null;
        var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "sepia");
        document.documentElement.setAttribute("data-theme", theme);
        var scale = parseFloat(localStorage.getItem("md2html-font-scale"));
        if (scale >= 0.85 && scale <= 1.4) document.documentElement.style.setProperty("--fs-scale", scale);
        var s = JSON.parse(localStorage.getItem("md2html-read-settings") || "{}");
        var allowed = { font: ["sans", "serif", "kai"], lh: ["tight", "loose"], para: ["indent"], flip: ["page"] };
        for (var k in allowed) if (allowed[k].indexOf(s[k]) >= 0) document.documentElement.setAttribute("data-" + k, s[k]);
      } catch (e) { /* private mode / blocked storage */ }
    })();
  </script>
  <style>
    /* ============================================================
       TOKENS
       ============================================================ */
    :root {
      color-scheme: light;
      /* Long-read comfort: body text ~13:1, not 16:1+; cards sit barely
         above the page so the column has no brighter patches. */
      --bg: #F7F5EF;
      --surface: #FCFBF8;
      --surface-2: #F2F0E9;
      --surface-3: #ECEAE2;
      --text: #2B2A27;
      --text-muted: #4F4D47;
      --text-subtle: #6B6862;
      --accent: #D97757;
      --accent-hover: #C56843;
      --accent-soft: #FBEEE6;
      --accent-border: #F0D5C4;
      --accent-strong: #A85533;
      /* Solid fills (badges / skip / done): dark enough for white label text */
      --accent-fill: #A85533;
      --accent-on: #FFFFFF;
      /* Body links: AA-friendly terracotta; hover darkens further */
      --link: #A85533;
      --link-hover: #8B4328;
      --border: #E3E0D6;
      --border-strong: #CBC8BC;
      --code-bg: #F2EFE7;
      --code-text: #2E2D2A;
      --info: #2563EB;
      --info-soft: #EFF6FF;
      --info-border: #BFDBFE;
      --warn: #B45309;
      --warn-soft: #FFFBEB;
      --warn-border: #FDE68A;
      --danger: #B91C1C;
      --danger-soft: #FEF2F2;
      --danger-border: #FECACA;
      --success: #047857;
      --success-soft: #ECFDF5;
      --success-border: #A7F3D0;
      --decision: #6D28D9;
      --decision-soft: #F5F3FF;
      --decision-border: #DDD6FE;
      --shadow-sm: 0 1px 2px rgba(20, 14, 8, 0.04);
      --shadow: 0 1px 2px rgba(20, 14, 8, 0.04), 0 4px 12px rgba(20, 14, 8, 0.06);
      --shadow-lg: 0 8px 24px rgba(20, 14, 8, 0.10);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      /* Fixed length, not ch: ch resolves per element font-size, so callouts
         (15.5px) shrank and the thesis box (18px) overflowed the column.
         rem, so A−/A+ scales the column with the type: ~47 CJK chars per
         line at the 17px body size, at every scale. */
      --measure: 50rem;
      /* Sidebar stays 220px while the article can hold ~34 CJK chars (36rem),
         then narrows only to 200px so a section title still wraps to two lines.
         The 760px drawer matches isMobileToc(). */
      --layout-gap: 32px;
      --layout-pad-x: 24px;
      --toc-width: clamp(200px, calc(100vw - 36rem - var(--layout-gap) - var(--layout-pad-x) * 2), 220px);
      /* System fonts only: web fonts are slow/blocked in mainland China and
         useless offline; CJK glyphs always came from the system anyway. */
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif;
      --font-mono: 'SF Mono', 'Cascadia Code', Consolas, Menlo, monospace;
      --font-serif: Georgia, 'Noto Serif SC', 'Noto Serif CJK SC', 'Source Han Serif SC', 'Songti SC', STSong, SimSun, serif;
      --font-kai: Georgia, 'Kaiti SC', STKaiti, KaiTi, 'LXGW WenKai', serif;
      --z-progress: 200;
      --z-topbar: 100;
      --z-drawer: 300;
      --z-backdrop: 250;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #1A1714;
      --surface: #221E1A;
      --surface-2: #2A2520;
      --surface-3: #322C26;
      /* Off-white text (~13:1) avoids halation on dark backgrounds;
         semantic hues are desaturated so callouts do not glow. */
      --text: #E3DCD0;
      --text-muted: #BDB5A9;
      --text-subtle: #958E84;
      --accent: #D9957A;
      --accent-hover: #E3A68C;
      --accent-soft: #3A2A22;
      --accent-border: #6B4A38;
      --accent-strong: #EBB49A;
      --accent-fill: #D9957A;
      --accent-on: #1A1410;
      --link: #EBB49A;
      --link-hover: #E3A68C;
      --border: #3F3832;
      --border-strong: #5A524A;
      --code-bg: #2A2520;
      --code-text: #DAD3C7;
      --info: #8DB4E2;
      --info-soft: #1E2A3D;
      --info-border: #2A4365;
      --warn: #E5B656;
      --warn-soft: #332817;
      --warn-border: #5C4520;
      --danger: #EBA3A3;
      --danger-soft: #3A1F1F;
      --danger-border: #5C2A2A;
      --success: #84CFAF;
      --success-soft: #1A3329;
      --success-border: #1F5C45;
      --decision: #B9ADE6;
      --decision-soft: #2A1F40;
      --decision-border: #4A3870;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    /* 护眼: low-luminance warm paper for long daytime reading */
    [data-theme="sepia"] {
      color-scheme: light;
      --bg: #F4ECD8;
      --surface: #F8F2E2;
      --surface-2: #EEE4CD;
      --surface-3: #E7DCC1;
      --text: #3B3226;
      --text-muted: #5A4E3E;
      --text-subtle: #72655A;
      --accent: #B86E45;
      --accent-hover: #A35E38;
      --accent-soft: #EEDCC3;
      --accent-border: #DDC09E;
      --accent-strong: #8A4826;
      --accent-fill: #8A4826;
      --accent-on: #FFF8EC;
      --link: #8A4826;
      --link-hover: #6E3A1E;
      --border: #E0D3B6;
      --border-strong: #C8B791;
      --code-bg: #EDE3CB;
      --code-text: #3B3226;
      --info: #2F5F96;
      --info-soft: #E6E5D6;
      --info-border: #BFC8C4;
      --warn: #8F5A12;
      --warn-soft: #F3E5C4;
      --warn-border: #DEC48A;
      --danger: #9B2C24;
      --danger-soft: #F2DDCB;
      --danger-border: #E2B9A2;
      --success: #2F6B4C;
      --success-soft: #E3E6CF;
      --success-border: #B9CDAE;
      --decision: #5E3F94;
      --decision-soft: #E9E0DA;
      --decision-border: #CDBFD0;
      --shadow-sm: 0 1px 2px rgba(60, 40, 15, 0.05);
      --shadow: 0 1px 2px rgba(60, 40, 15, 0.05), 0 4px 12px rgba(60, 40, 15, 0.07);
      --shadow-lg: 0 8px 24px rgba(60, 40, 15, 0.12);
    }

    /* 阅读: e-ink paper — grayscale, flat, still, serif body. Hierarchy comes
       from weight, rules and spacing only; semantic hues all collapse to ink. */
    [data-theme="reader"] {
      color-scheme: light;
      --bg: #F5F4EF;
      --surface: #F5F4EF;
      --surface-2: #ECEBE5;
      --surface-3: #E4E3DC;
      --text: #262624;
      --text-muted: #474743;
      --text-subtle: #64635D;
      --accent: #6E6D67;
      --accent-hover: #4A4A46;
      --accent-soft: #E9E8E2;
      --accent-border: #C9C8C0;
      --accent-strong: #262624;
      --accent-fill: #363633;
      --accent-on: #F5F4EF;
      --link: #262624;
      --link-hover: #000000;
      --border: #D8D7D0;
      --border-strong: #B4B3AB;
      --code-bg: #ECEBE5;
      --code-text: #262624;
      --info: #363633;         --info-soft: transparent;     --info-border: #C9C8C0;
      --warn: #363633;         --warn-soft: transparent;     --warn-border: #C9C8C0;
      --danger: #363633;       --danger-soft: transparent;   --danger-border: #C9C8C0;
      --success: #363633;      --success-soft: transparent;  --success-border: #C9C8C0;
      --decision: #363633;     --decision-soft: transparent; --decision-border: #C9C8C0;
      --shadow-sm: none;
      --shadow: none;
      --shadow-lg: none;
    }
    [data-theme="reader"] .content { font-family: var(--font-serif); }
    [data-theme="reader"] .content :is(h1, h2, h3, h4, summary, .callout-title, .step-speaker, .tag, code, pre) { font-family: var(--font-sans); }
    [data-theme="reader"] .content pre, [data-theme="reader"] .content code { font-family: var(--font-mono); }
    /* E-ink ghosts on every repaint: no transitions, smooth scroll or glass. */
    [data-theme="reader"], [data-theme="reader"] * { transition: none !important; scroll-behavior: auto !important; }
    [data-theme="reader"] .topbar { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
    [data-theme="reader"] .highlight { background: var(--surface-2); box-shadow: none; }
    [data-theme="reader"] .section-insight { box-shadow: none; }
    [data-theme="reader"] .content strong,
    [data-theme="reader"] .highlight strong,
    [data-theme="reader"] .section-insight strong {
      color: var(--text); font-weight: 700; background: none; border: none; padding: 0;
    }
    [data-theme="reader"] .content a { border-bottom-color: var(--border-strong); }
    /* Speakers lose their hues; the host keeps a solid badge to stay distinct.
       Opaque badge background, or the transparent soft lets the timeline rule show through. */
    [data-theme="reader"] .step .step-num { background: var(--bg); }
    [data-theme="reader"] .step.speaker-host .step-num { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* ============================================================
       BASE
       ============================================================ */
    * { box-sizing: border-box; }
    /* All type is rem so the reader's A−/A+ (--fs-scale) scales every block */
    html { scroll-behavior: smooth; scroll-padding-top: 80px; font-size: calc(100% * var(--fs-scale, 1)); }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: var(--lh, 1.78);
      font-size: 1.0625rem;
      transition: background-color 0.2s, color 0.2s;
    }

    /* ---- 「Aa」reader settings: attributes on <html>, set before first paint ---- */
    html[data-lh="tight"] { --lh: 1.6; }
    html[data-lh="loose"] { --lh: 2; }
    /* Line length follows --measure (~47 CJK chars at 17px), at every A−/A+ scale. */
    /* Beats the reader theme's own serif (0,2,0); headings stay sans, code mono. */
    html[data-font="sans"] .content { font-family: var(--font-sans); }
    html[data-font="serif"] .content { font-family: var(--font-serif); }
    html[data-font="kai"] .content { font-family: var(--font-kai); }
    html[data-font] .content :is(h1, h2, h3, h4, summary, .callout-title, .step-speaker, .tag) { font-family: var(--font-sans); }
    html[data-font] .content :is(pre, code) { font-family: var(--font-mono); }
    /* Book paragraphs: first-line indent, no blank line between paragraphs */
    html[data-para="indent"] .content > p,
    html[data-para="indent"] .step-body p:not(.step-speaker) { text-indent: 2em; margin-bottom: 0.3em; }
    /* macOS: grayscale AA thins light-on-dark text helpfully but makes dark
       text on paper look washed out, so only the dark theme opts in. */
    [data-theme="dark"] body { -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--accent-soft); color: var(--accent-strong); }

    /* Skip link */
    .skip-link {
      position: absolute;
      top: -100px; left: 8px;
      padding: 10px 16px;
      background: var(--accent-fill);
      color: var(--accent-on);
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-weight: 500;
      z-index: 1000;
      transition: top 0.15s;
    }
    .skip-link:focus { top: 8px; }

    /* SVG sprite container (hidden) */
    .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { display: inline-block; flex-shrink: 0; vertical-align: middle; stroke: currentColor; fill: none; }

    /* Scroll progress bar */
    .scroll-progress {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0;
      background: var(--accent);
      z-index: var(--z-progress);
      transition: width 0.05s linear;
    }

    /* ============================================================
       TOPBAR
       ============================================================ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: var(--z-topbar);
      background: var(--bg);
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: calc(var(--toc-width) + var(--layout-gap) + var(--measure) + var(--layout-pad-x) * 2);
      margin: 0 auto;
      padding: 10px var(--layout-pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: var(--text);
      font-size: 14px;
    }
    .brand-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .topbar-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      width: 40px; height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background-color 0.15s;
      padding: 0;
    }
    .icon-btn .icon { width: 18px; height: 18px; stroke-width: 2; }
    .text-btn {
      height: 40px;
      padding: 0 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .text-btn[hidden] { display: none; }
    .text-btn[aria-pressed="true"] {
      background: var(--accent-fill);
      border-color: var(--accent-fill);
      color: var(--accent-on);
    }
    .icon-btn[hidden] { display: none; }
    .font-scale { display: inline-flex; }
    /* Fixed px: the controls must not grow with the reader's own A+ */
    .font-btn { width: 36px; font: 600 14px/1 var(--font-sans); letter-spacing: -0.02em; }
    .font-scale .font-btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
    .font-scale .font-btn + .font-btn { margin-left: -1px; }
    .font-scale .font-btn:not(:first-child):not(:last-child) { border-radius: 0; }
    .font-scale .font-btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
    .font-reset { width: 48px; font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: 0; }
    .font-btn:disabled { opacity: 0.4; cursor: default; }
    /* At 100% the reset has nothing to do but still shows the scale: dim, not faded out. */
    .font-reset:disabled { opacity: 0.7; }

    /* ============================================================
       LAYOUT
       ============================================================ */
    .layout {
      max-width: calc(var(--toc-width) + var(--layout-gap) + var(--measure) + var(--layout-pad-x) * 2);
      margin: 0 auto;
      display: grid;
      grid-template-columns: var(--toc-width) minmax(0, var(--measure));
      justify-content: center;
      gap: var(--layout-gap);
      padding: 32px var(--layout-pad-x) 96px;
    }
    .content { min-width: 0; }
    /* Unified reading measure: every top-level block shares one width so
       paragraphs, callouts, diagrams, timelines, tables and code align to a
       single clean column. Opt out with .full-bleed where truly needed. */
    .content > * { max-width: var(--measure); }
    .content > .full-bleed { max-width: none; }

    /* ============================================================
       TOC (desktop + mobile drawer)
       ============================================================ */
    .toc {
      position: sticky;
      top: 80px;
      align-self: start;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      padding-right: 8px;
    }
    /* Scrollbar stays invisible until the reader points at the TOC: a TOC that
       overflows by a few px otherwise shows a near-full-height thumb that reads
       as a heavy divider between TOC and article. The active link is kept in
       view by the scrollspy, so the bar is rarely needed. */
    .toc { scrollbar-width: thin; scrollbar-color: transparent transparent; }
    .toc:hover, .toc:focus-within { scrollbar-color: var(--border-strong) transparent; }
    .toc::-webkit-scrollbar { width: 6px; }
    .toc::-webkit-scrollbar-track { background: transparent; }
    .toc::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
    .toc:hover::-webkit-scrollbar-thumb,
    .toc:focus-within::-webkit-scrollbar-thumb { background: var(--border-strong); }
    .toc-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px 12px;
    }
    .toc-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-subtle);
      margin: 0;
    }
    .toc-close { display: none; }
    .toc-nav { display: flex; flex-direction: column; gap: 2px; }
    .toc-nav a {
      display: flex; align-items: center;
      min-height: 36px;
      padding: 8px 14px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      border-left: 2px solid transparent;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      transition: color 0.15s, background-color 0.15s, border-color 0.15s;
      line-height: 1.4;
    }
    .toc-nav a.active {
      color: var(--link);
      border-left-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 500;
    }
    .toc-nav a.lvl-3 { padding-left: 26px; font-size: 0.8125rem; }
    /* Content sections are numbered in both TOC and body (same counter order). */
    .toc-nav { counter-reset: toc-sec; }
    .toc-nav a.toc-sec { align-items: baseline; }
    .toc-nav a.toc-sec::before {
      counter-increment: toc-sec;
      content: counter(toc-sec, decimal-leading-zero);
      flex: 0 0 1.7em;
      color: var(--text-subtle);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .toc-nav a.toc-sec.active::before { color: var(--link); }
    .toc-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: var(--z-backdrop);
      opacity: 0;
      transition: opacity 0.2s;
    }

    /* ============================================================
       DOC HEADER
       ============================================================ */
    .doc-header {
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .doc-eyebrow {
      display: inline-flex; align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      border: 1px solid var(--accent-border);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }
    .doc-title {
      font-size: clamp(1.75rem, 3vw + 1rem, 2.5rem);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0;
      margin: 0 0 12px;
      color: var(--text);
      text-wrap: balance;
    }
    .doc-subtitle {
      font-size: clamp(0.9375rem, 0.6vw + 0.8125rem, 1.125rem);
      color: var(--text-muted);
      line-height: 1.55;
      margin: 0 0 20px;
      max-width: var(--measure);
      text-wrap: pretty;
    }
    .doc-subtitle:empty { display: none; }
    .doc-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.84375rem;
      color: var(--text-subtle);
    }
    .doc-meta-item { display: inline-flex; align-items: center; gap: 6px; }
    .doc-meta .icon { width: 14px; height: 14px; stroke-width: 2; }

    /* ============================================================
       CONTENT (typography)
       ============================================================ */
    .content h1, .content h2, .content h3, .content h4 {
      color: var(--text);
      line-height: 1.4;
      letter-spacing: 0;
      scroll-margin-top: 80px;
      text-wrap: balance;
    }
    .content h2 {
      font-size: 1.6875rem;
      font-weight: 600;
      margin: 56px 0 16px;
      padding-top: 8px;
      position: relative;
    }
    .content { counter-reset: sec; }
    .content h2.sec::before {
      counter-increment: sec;
      content: counter(sec, decimal-leading-zero);
      display: block;
      margin-bottom: 4px;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent-strong);
      font-variant-numeric: tabular-nums;
    }

    /* 对谈实录 / 原声交锋 fold (「只看要点」 closes them all) */
    details.dialogue-fold { margin: 0; }
    details.dialogue-fold > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      border-radius: var(--radius-sm);
    }
    details.dialogue-fold > summary::-webkit-details-marker { display: none; }
    details.dialogue-fold > summary .layer-heading { margin: 0; }
    details.dialogue-fold > summary .anchor { display: none; }
    .fold-count { font-size: 0.8125rem; color: var(--text-subtle); }
    details.dialogue-fold > summary::after {
      content: "收起";
      font-size: 0.8125rem;
      color: var(--link);
    }
    details.dialogue-fold:not([open]) > summary::after { content: "展开"; }
    details.dialogue-fold:not([open]) > summary {
      padding: 10px 14px;
      margin-top: 20px;
      border: 1px dashed var(--border-strong);
      background: var(--surface);
    }
    .content h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 36px 0 12px;
      position: relative;
    }
    .content h4 {
      font-size: 0.84375rem;
      font-weight: 600;
      margin: 24px 0 8px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .content > p,
    .content > ul,
    .content > ol,
    .content > blockquote { max-width: var(--measure); }
    .content p { margin: 0 0 16px; text-wrap: pretty; overflow-wrap: anywhere; }
    /* Book setting: a clean right edge, strict CJK breaking (no 。，」 at line
       start), and CJK/Latin spacing where the source has none. */
    .content p, .content li { text-align: justify; line-break: strict; text-autospace: normal; }
    .content a { color: var(--link); text-decoration: none; border-bottom: 1px solid var(--accent-border); }
    .content ul, .content ol { padding-left: 24px; margin: 0 0 16px; }
    .content li { margin: 8px 0; }
    /* Key-info mark: soft accent chip — not link-blue, keeps hierarchy with tip/highlight */
    /* Borderless and faint: a note can carry 40+ marks, and outlined chips
       turn a page into a field of orange boxes. */
    .content strong {
      color: var(--accent-strong);
      font-weight: 650;
      background: color-mix(in srgb, var(--accent-soft) 55%, transparent);
      padding: 0.04em 0.2em;
      margin: 0 0.04em;
      border-radius: 3px;
      border: none;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    [data-theme="dark"] .content strong {
      background: color-mix(in srgb, var(--accent-soft) 45%, transparent);
    }
    /* Keep names / dialogue quotes calm — emphasis belongs to thesis & analysis */
    .speaker-bio strong,
    .timeline strong,
    .callout-info strong,
    [data-theme="dark"] .speaker-bio strong,
    [data-theme="dark"] .timeline strong,
    [data-theme="dark"] .callout-info strong {
      color: var(--text);
      font-weight: 600;
      background: transparent;
      padding: 0;
      margin: 0;
      border: none;
    }
    .content em { color: var(--text-muted); }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 40px 0; }

    /* Anchor links injected by JS on h2/h3 with id */
    .anchor {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px;
      margin-left: 6px;
      color: var(--text-subtle);
      opacity: 0;
      transform: translateY(-1px);
      transition: opacity 0.15s, color 0.15s;
      border-bottom: none !important;
      border-radius: var(--radius-sm);
    }
    .anchor .icon { width: 14px; height: 14px; stroke-width: 2; }

    /* Images */
    .content img {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin: 20px 0;
      display: block;
    }
    .content figure { margin: 20px 0; }
    .content figure img { margin: 0; }
    .content figcaption {
      font-size: 0.84375rem;
      color: var(--text-subtle);
      margin-top: 8px;
      text-align: center;
    }
    .content video {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: block;
      background: #111;
    }
    .content figure.source-figure a { border-bottom: none; }

    /* Task lists (- [ ] / - [x]) */
    .content .task-list-item { list-style: none; margin-left: -22px; }
    .content .task-list-item-checkbox {
      margin-right: 8px;
      vertical-align: -2px;
      accent-color: var(--accent);
    }

    /* Footnotes */
    .content .footnote-ref a,
    .content sup a {
      font-size: 0.75em;
      vertical-align: super;
      border-bottom: none;
      padding: 0 2px;
    }
    .content .footnotes {
      margin-top: 56px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 0.9375rem;
      color: var(--text-muted);
    }

    /* ============================================================
       CODE
       ============================================================ */
    .content code {
      font-family: var(--font-mono);
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88em;
      color: var(--code-text);
      border: 1px solid var(--border);
      overflow-wrap: anywhere;
    }
    .content pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      overflow-x: auto;
      font-size: 0.875rem;
      line-height: 1.6;
      margin: 16px 0;
      position: relative;
    }
    .content pre code {
      background: none; padding: 0; border: none;
      color: var(--code-text);
      font-size: inherit;
    }
    .copy-btn {
      position: absolute;
      top: 8px; right: 8px;
      width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-subtle);
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, border-color 0.15s;
      padding: 0;
    }
    .copy-btn .icon { width: 14px; height: 14px; stroke-width: 2; }
    .copy-btn.copied { color: var(--success); border-color: var(--success-border); opacity: 1; }

    /* ============================================================
       TIMELINE / STEPS
       ============================================================ */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
      position: relative;
    }
    .timeline::before {
      content: "";
      position: absolute;
      left: 19px;
      top: 16px;
      bottom: 16px;
      width: 2px;
      background: linear-gradient(180deg, var(--accent-border), var(--border));
    }
    .step {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 16px;
      align-items: start;
      padding: 8px 4px;
      position: relative;
      border-radius: var(--radius);
      transition: background-color 0.15s;
    }
    .step-num {
      width: 40px; height: 40px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface);
      border: 2px solid var(--accent);
      color: var(--accent);
      border-radius: 50%;
      font-weight: 600;
      font-size: 0.78125rem;
      letter-spacing: 0.02em;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
      position: relative;
      z-index: 1;
    }
    .step.done .step-num { background: var(--accent-fill); color: var(--accent-on); }
    .step-body { padding-top: 7px; min-width: 0; }
    .step-body h3,
    .step-body .step-speaker {
      margin: 0 0 4px;
      font-size: 0.96875rem;
      font-weight: 600;
      line-height: 1.5;
    }
    .step-body p { margin: 0 0 16px; color: var(--text); font-size: 1.03125rem; line-height: calc(var(--lh, 1.78) + 0.02); max-width: var(--measure); }
    .step-body p:last-child { margin-bottom: 0; }
    .step-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* ============================================================
       CALLOUTS
       ============================================================ */
    .callout {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 14px;
      padding: 14px 18px;
      border-radius: var(--radius);
      border: 1px solid;
      margin: 20px 0;
      font-size: 0.96875rem;
      line-height: 1.6;
      max-width: var(--measure);
    }
    .callout-icon { width: 20px; height: 20px; margin-top: 2px; stroke-width: 2; }
    .callout-body { min-width: 0; }
    .callout-title { font-weight: 600; margin: 0 0 4px; font-size: 0.9375rem; }
    .callout-body p:last-child { margin-bottom: 0; }
    .callout-body code {
      background: color-mix(in srgb, var(--text) 6%, transparent);
      border-color: color-mix(in srgb, var(--border) 80%, transparent);
    }

    .callout-info     { background: var(--info-soft);     border-color: var(--info-border);     color: var(--text); }
    .callout-info     .callout-title, .callout-info     .callout-icon { color: var(--info); }
    .callout-warn     { background: var(--warn-soft);     border-color: var(--warn-border);     color: var(--text); }
    .callout-warn     .callout-title, .callout-warn     .callout-icon { color: var(--warn); }
    .callout-danger   { background: var(--danger-soft);   border-color: var(--danger-border);   color: var(--text); }
    .callout-danger   .callout-title, .callout-danger   .callout-icon { color: var(--danger); }
    .callout-success  { background: var(--success-soft);  border-color: var(--success-border);  color: var(--text); }
    .callout-success  .callout-title, .callout-success  .callout-icon { color: var(--success); }
    .callout-decision { background: var(--decision-soft); border-color: var(--decision-border); color: var(--text); }
    .callout-decision .callout-title, .callout-decision .callout-icon { color: var(--decision); }
    .callout-tip      { background: var(--accent-soft);   border-color: var(--accent-border);   color: var(--text); }
    .callout-tip      .callout-title, .callout-tip      .callout-icon { color: var(--accent-strong); }

    /* ============================================================
       KEY-POINT HIGHLIGHT
       ============================================================ */
    .highlight {
      position: relative;
      background: linear-gradient(135deg, var(--accent-soft) 0%, var(--surface) 55%, var(--surface-2) 100%);
      border: 1px solid var(--accent-border);
      border-left: 5px solid var(--accent);
      padding: 20px 24px 20px 22px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin: 24px 0;
      font-size: 1.125rem;
      font-weight: 500;
      line-height: 1.65;
      max-width: var(--measure);
      box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 12%, transparent), var(--shadow);
      color: var(--text);
    }
    .highlight.highlight-conflict::before {
      content: "核心冲突";
    }
    .highlight::before {
      content: "全文论点";
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-strong);
      background: var(--surface);
      border: 1px solid var(--accent-border);
      border-radius: 999px;
      padding: 2px 10px;
      margin: 0 0 10px;
    }
    .highlight p { margin: 0; }
    .highlight strong {
      color: var(--accent-strong);
      font-weight: 700;
      background: color-mix(in srgb, var(--accent-soft) 70%, var(--surface));
      border: 1px solid var(--accent-border);
    }
    .highlight-label {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-strong);
      margin-bottom: 6px;
    }

    /* ============================================================
       SPEAKER / PEOPLE BIO (opens the article)
       ============================================================ */
    .speaker-bio {
      margin: 0 0 8px;
      scroll-margin-top: 80px;
    }
    .speaker-bio .callout-title {
      margin-bottom: 6px;
    }
    .speaker-bio + h2 {
      margin-top: 32px;
    }

    /* ============================================================
       MERMAID
       ============================================================ */
    .diagram {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin: 24px 0;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }
    .diagram-caption {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      font-size: 0.84375rem;
      color: var(--text-subtle);
      text-align: center;
    }
    .mermaid { text-align: center; min-height: 80px; }
    .mermaid svg { max-width: 100%; height: auto; }
    .mermaid:not([data-processed]) {
      opacity: 0.4;
      font-family: var(--font-mono);
      font-size: 0.78125rem;
      color: var(--text-subtle);
      white-space: pre-wrap;
      text-align: left;
    }
    /* CDN unreachable (offline / blocked): show the flow as plain "A → B" lines
       instead of raw Mermaid source. */
    .mermaid.mermaid-fallback {
      opacity: 1;
      font-family: var(--font-sans);
      font-size: 0.90625rem;
      line-height: 1.9;
      color: var(--text-muted);
      white-space: pre-line;
      text-align: left;
    }

    /* 只看嘉宾: hide the host's turns in 对谈实录 (reader toggle, default off) */
    body.guest-only .step.speaker-host { display: none; }

    /* ============================================================
       PROS / CONS
       ============================================================ */
    .proscons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 24px 0;
    }
    .proscons-col {
      padding: 16px 20px;
      border-radius: var(--radius);
      border: 1px solid;
    }
    .proscons-col h4 {
      margin: 0 0 12px;
      font-size: 0.84375rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex; align-items: center; gap: 8px;
    }
    .proscons-col ul { margin: 0; padding-left: 18px; }
    .proscons-col li { margin: 6px 0; }
    .pros { background: var(--success-soft); border-color: var(--success-border); }
    .pros h4 { color: var(--success); }
    .cons { background: var(--danger-soft); border-color: var(--danger-border); }
    .cons h4 { color: var(--danger); }

    /* ============================================================
       COMPARISON CARDS
       ============================================================ */
    .compare {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin: 24px 0;
    }
    .compare-card {
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.18s, box-shadow 0.18s;
      position: relative;
    }
    .compare-card.recommended { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .compare-card.recommended::before {
      content: var(--rec-label, "★ Recommended");
      position: absolute; top: -10px; right: 14px;
      background: var(--accent-fill); color: var(--accent-on);
      padding: 2px 10px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600;
    }
    .compare-card h4 { margin: 0 0 8px; font-size: 1rem; color: var(--text); text-transform: none; letter-spacing: normal; }
    .compare-card p { margin: 0; color: var(--text-muted); font-size: 0.9375rem; }

    /* ============================================================
       COLLAPSIBLE
       ============================================================ */
    details.collapsible {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin: 16px 0;
      background: var(--surface);
      overflow: hidden;
    }
    details.collapsible[open] { box-shadow: var(--shadow-sm); }
    details.collapsible > summary {
      cursor: pointer;
      padding: 14px 18px;
      font-weight: 500;
      color: var(--text);
      list-style: none;
      display: flex; align-items: center; gap: 10px;
      user-select: none;
      transition: background 0.15s;
      min-height: 44px;
    }
    details.collapsible > summary::-webkit-details-marker { display: none; }
    details.collapsible > summary::before {
      content: "›";
      display: inline-block;
      transition: transform 0.18s;
      color: var(--accent);
      font-size: 1.125rem;
      font-weight: 700;
    }
    details.collapsible[open] > summary::before { transform: rotate(90deg); }
    .collapsible-body { padding: 4px 18px 18px; border-top: 1px solid var(--border); }
    .collapsible-body > *:first-child { margin-top: 12px; }

    /* ============================================================
       TABLES (wrapped via .table-wrap or naturally responsive)
       ============================================================ */
    .table-wrap {
      overflow-x: auto;
      margin: 20px 0;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      /* 100% fills a parent already on --measure (glossary, metadata).
         A top-level wrap is also `.content > *`. This rule is the same
         specificity and comes later, so it would stretch body tables to the
         grid column. The restatement below keeps those on the reading measure. */
      max-width: 100%;
    }
    .content > .table-wrap,
    .content > table { max-width: var(--measure); }
    .content table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
      background: var(--surface);
      margin: 0;
    }
    /* Standalone tables (not inside .table-wrap) keep visual border */
    .content > table {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin: 20px 0;
    }
    .content th {
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .content td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      vertical-align: top;
    }
    .content tr:last-child td { border-bottom: none; }

    /* ============================================================
       BLOCKQUOTE
       ============================================================ */
    .content blockquote {
      margin: 20px 0;
      padding: 12px 18px;
      border-left: 3px solid var(--border-strong);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 1rem;
    }
    .content blockquote p:last-child { margin-bottom: 0; }

    /* ============================================================
       FOOTER
       ============================================================ */
    .doc-footer {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 0.84375rem;
      color: var(--text-subtle);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .doc-footer a { color: var(--link); text-decoration: none; }

    /* ============================================================
       FOCUS-VISIBLE (a11y)
       ============================================================ */
    *:focus { outline: none; }
    *:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }
    .toc-nav a:focus-visible { outline-offset: -2px; }
    .icon-btn:focus-visible { outline-offset: 2px; }
    .anchor:focus-visible { opacity: 1; outline-offset: 2px; }
    details.collapsible > summary:focus-visible { outline-offset: -2px; }

    /* ============================================================
       HOVER (only on hover-capable devices to avoid sticky-tap on mobile)
       ============================================================ */
    @media (hover: hover) {
      .back-to-top:hover { color: var(--link); border-color: var(--accent-border); background: var(--accent-soft); }
      .icon-btn:hover { color: var(--link); border-color: var(--accent-border); background: var(--accent-soft); }
      .toc-nav a:hover { color: var(--link); background: var(--accent-soft); }
      .content a:hover { color: var(--link-hover); border-bottom-color: var(--accent-strong); }
      .compare-card:hover { border-color: var(--accent-border); box-shadow: var(--shadow); }
      .compare-card.recommended:hover { border-color: var(--accent); }
      .content tr:hover td { background: var(--surface-2); }
      details.collapsible > summary:hover { background: var(--surface-2); }
      .anchor:hover { color: var(--link); }
      .content h2:hover .anchor,
      .content h3:hover .anchor { opacity: 1; }
      .copy-btn:hover { color: var(--link); border-color: var(--accent-border); }
      .content pre:hover .copy-btn { opacity: 1; }
    }
    /* On touch devices, copy-btn is always visible at low opacity */
    @media (hover: none) {
      .copy-btn { opacity: 0.6; }
      .anchor { opacity: 0.4; }
    }

    /* ============================================================
       NARROW (≤760px) — TOC becomes off-canvas drawer.
       Keep this breakpoint in sync with isMobileToc().
       ============================================================ */
    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 20px 16px 80px;
      }
      .topbar-inner { padding: 8px 12px; }
      .doc-header { margin-bottom: 28px; padding-bottom: 20px; }

      .toc-mobile-trigger { display: inline-flex !important; }

      .toc {
        position: fixed;
        top: 0; left: 0;
        width: min(300px, 82vw);
        height: 100dvh;
        max-height: 100dvh;
        background: var(--surface);
        z-index: var(--z-drawer);
        padding: 16px 8px 24px 16px;
        box-shadow: var(--shadow-lg);
        transform: translateX(-105%);
        transition: transform 0.25s ease;
      }
      .toc-head { padding: 4px 4px 12px 8px; }
      .toc-close {
        display: inline-flex !important;
        width: 36px; height: 36px;
        align-items: center; justify-content: center;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        cursor: pointer;
        padding: 0;
      }
      .toc-close .icon { width: 18px; height: 18px; stroke-width: 2; }
      body.toc-open .toc { transform: translateX(0); }
      body.toc-open .toc-backdrop {
        display: block;
        opacity: 1;
      }
      .toc-backdrop {
        display: block;
        opacity: 0;
        pointer-events: none;
      }
      body.toc-open .toc-backdrop { pointer-events: auto; }
      body.toc-open { overflow: hidden; }
    }
    /* Phones: print is rarely used here; free its slot for A−/A+ */
    @media (max-width: 600px) {
      .brand > span { display: none; }
      .topbar-actions { gap: 4px; }
      .text-btn { padding: 0 8px; white-space: nowrap; font-size: 13px; }
      .font-btn { width: 30px; }
      .font-reset { width: 42px; font-size: 11.5px; }
    }
    @media (min-width: 761px) {
      .toc-mobile-trigger { display: none !important; }
      /* Desktop: pointer targets can be tighter than the touch drawer's 36px,
         which lets a 15–20 entry TOC fit without its own scroll. */
      .toc-nav a { min-height: 30px; padding: 5px 14px; }
    }

    /* ============================================================
       REDUCED MOTION (a11y)
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      html { scroll-behavior: auto; }
      .brand-dot { animation: none; box-shadow: 0 0 0 4px var(--accent-soft); }
    }

    /* ============================================================
       LAYER HEADINGS (对谈三层结构)
       ============================================================ */
    .layer-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
    }
    .layer-heading::before {
      flex-shrink: 0;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    /* Pill replaces the visible heading text (still read by screen readers).
       Must out-rank `.content h3` or both the pill and the text render. */
    .content h3.layer-heading { font-size: 0; }
    .content h3.layer-heading::before { font-size: 0.75rem; }
    .content h3.layer-heading .anchor { font-size: 0.875rem; }
    .layer-insight::before {
      content: "洞察";
      background: var(--accent-soft);
      color: var(--accent-strong);
      border: 1px solid var(--accent-border);
    }
    .layer-analysis::before {
      content: "解析";
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .layer-dialogue::before {
      content: "实录";
      background: var(--info-soft);
      color: var(--info);
      border: 1px solid var(--info-border);
    }
    .layer-clash::before {
      content: "交锋";
      background: var(--decision-soft);
      color: var(--decision);
      border: 1px solid var(--decision-border);
    }
    .layer-context::before {
      content: "释义";
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .layer-open::before {
      content: "未决";
      background: var(--warn-soft);
      color: var(--warn);
      border: 1px solid var(--warn-border);
    }
    .section-insight {
      margin-top: 12px;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
      box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 10%, transparent), var(--shadow-sm);
      padding: 16px 18px 16px 16px;
      font-size: 1.03125rem;
      font-weight: 500;
    }
    .section-insight .callout-body p { margin: 0; }
    .section-insight .callout-icon {
      color: var(--accent);
      width: 22px;
      height: 22px;
    }
    .section-insight .callout-body {
      color: var(--text);
    }
    .section-insight strong {
      color: var(--accent-strong);
      font-weight: 700;
      background: color-mix(in srgb, var(--surface) 55%, var(--accent-soft));
      border: 1px solid var(--accent-border);
    }
    .section-open {
      margin-top: 12px;
      margin-bottom: 20px;
      border-left: 4px solid var(--warn);
      box-shadow: 0 1px 0 color-mix(in srgb, var(--warn) 10%, transparent), var(--shadow-sm);
      padding: 16px 18px 16px 16px;
    }
    .section-open .callout-body p { margin: 0; }
    .section-open .callout-body p + p { margin-top: 10px; }
    .section-open .callout-icon {
      color: var(--warn);
      width: 22px;
      height: 22px;
    }
    [data-theme="dark"] .highlight {
      box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow);
      background: linear-gradient(135deg, var(--accent-soft) 0%, var(--surface) 45%, var(--surface-2) 100%);
    }
    [data-theme="dark"] .section-insight {
      box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 14%, transparent), var(--shadow-sm);
    }

    /* Section jump pills (injected by JS) */
    .section-jump {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: -4px 0 20px;
      max-width: var(--measure);
    }
    .section-jump a {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 4px 12px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      transition: color 0.15s, border-color 0.15s, background-color 0.15s;
    }
    .section-jump a:hover,
    .section-jump a:focus-visible {
      color: var(--link);
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    /* Speaker differentiation in dialogue timeline.
       Roles are assigned by build_html.py: host from 对谈人物「主持」, guests in
       order of first appearance (palette cycles after 4). */
    .step { --spk: var(--accent-strong); --spk-soft: var(--accent-soft); }
    .step.speaker-host    { --spk: var(--info);          --spk-soft: var(--info-soft); }
    .step.speaker-guest-1 { --spk: var(--accent-strong); --spk-soft: var(--accent-soft); }
    .step.speaker-guest-2 { --spk: var(--success);       --spk-soft: var(--success-soft); }
    .step.speaker-guest-3 { --spk: var(--decision);      --spk-soft: var(--decision-soft); }
    .step.speaker-guest-4 { --spk: var(--warn);          --spk-soft: var(--warn-soft); }
    .step .step-num { border-color: var(--spk); color: var(--spk); background: var(--spk-soft); }
    .step .step-body h3,
    .step .step-body .step-speaker { color: var(--spk); }

    /* Meta panel + table URL wrap */
    .meta-panel { margin-bottom: 32px; }
    .toc-nav .toc-meta-link {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      color: var(--text-subtle);
      font-size: 0.8125rem;
    }
    .table-wrap td a { word-break: break-all; }

    /* Back to top */
    .back-to-top {
      position: fixed;
      right: 20px;
      bottom: 24px;
      z-index: 90;
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: opacity 0.2s, transform 0.2s, color 0.15s, border-color 0.15s;
      padding: 0;
    }
    .back-to-top .icon { width: 20px; height: 20px; stroke-width: 2; }
    .back-to-top:not([hidden]) { opacity: 1; transform: translateY(0); }
    .back-to-top[hidden] { display: inline-flex; opacity: 0; pointer-events: none; transform: translateY(8px); }

    /* ============================================================
       POPOVERS — theme menu and 「Aa」 typesetting panel
       ============================================================ */
    .settings-btn .aa { font: 600 16px/1 var(--font-serif); letter-spacing: -0.01em; }
    .topbar [aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent-border); color: var(--link); }
    .popover {
      /* Viewport-fixed; JS pins top/right under the button that opened it. */
      position: fixed;
      top: 62px;
      right: 16px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      z-index: var(--z-drawer);
      font: 13px/1.4 var(--font-sans);
      color: var(--text);
    }
    .popover[hidden] { display: none; }
    .theme-menu { width: 272px; padding: 6px; }
    .theme-menu button {
      display: grid; grid-template-columns: 28px auto 1fr; align-items: center; gap: 10px;
      width: 100%; padding: 7px 10px;
      border: none; border-radius: var(--radius-sm);
      background: transparent; color: var(--text);
      font: 500 14px/1.2 var(--font-sans); text-align: left; cursor: pointer;
    }
    .theme-menu .tm-hint { font-size: 12px; color: var(--text-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .theme-menu button[aria-checked="true"] { background: var(--accent-soft); color: var(--link); }
    @media (hover: hover) { .theme-menu button:not([aria-checked="true"]):hover { background: var(--surface-2); } }
    /* Swatches show their own paper and ink, whatever the active theme */
    .swatch {
      width: 26px; height: 26px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font: 600 13px/1 var(--font-serif);
      border: 1px solid rgba(0, 0, 0, 0.18);
    }
    .swatch-sepia  { background: #F4ECD8; color: #3B3226; }
    .swatch-reader { background: #F5F4EF; color: #262624; }
    .swatch-dark   { background: #1A1714; color: #E3DCD0; }
    .settings-panel { width: 320px; padding: 14px 16px 12px; }
    .set-row { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 10px; margin-bottom: 12px; }
    .set-label { font-size: 13px; color: var(--text-subtle); }
    .set-fs { display: none; }
    .seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .seg button {
      flex: 1;
      min-width: 0;
      height: 34px;
      padding: 0 4px;
      border: none;
      background: var(--surface);
      color: var(--text-muted);
      font: 500 13px/1 var(--font-sans);
      cursor: pointer;
    }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button[aria-checked="true"] { background: var(--accent-soft); color: var(--link); font-weight: 600; }
    .seg button[data-value="serif"] { font-family: var(--font-serif); font-size: 14px; }
    .seg button[data-value="kai"] { font-family: var(--font-kai); font-size: 15px; }
    @media (hover: hover) { .seg button:not([aria-checked="true"]):hover { background: var(--surface-2); } }
    .settings-panel .font-scale { display: flex; }
    .settings-panel .font-btn { flex: 1; width: auto; height: 34px; }
    .set-hint { margin: -6px 0 12px 46px; font-size: 12px; color: var(--text-subtle); }
    .set-foot { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
    .set-foot button {
      flex: 1; height: 32px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text-muted);
      font: 500 13px var(--font-sans); cursor: pointer;
    }
    @media (hover: hover) { .set-foot button:hover { background: var(--surface-2); color: var(--text); } }
    @media (max-width: 600px) {
      /* No room for A−/A+ in the topbar; the panel takes them over */
      .topbar .font-scale { display: none; }
      .set-fs { display: grid; }
      /* A bottom sheet within thumb reach */
      .settings-panel {
        top: auto !important; left: 0; right: 0 !important; bottom: 0;
        width: auto;
        max-height: 82vh;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
      }
    }

    /* ============================================================
       IMMERSIVE READING — chrome steps aside while scrolling down
       ============================================================ */
    .topbar { transition: transform 0.2s ease; }
    body.chrome-hidden .topbar { transform: translateY(-100%); }

    /* Kindle-style footer: time left in this section · share of the note */
    .read-status {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 80;
      padding: 3px 12px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      color: var(--text-subtle);
      font: 12px/1.6 var(--font-sans);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
    }
    .read-status[hidden] { display: none; }
    /* Wide screens have an empty right margin: keep the pill off the text column. */
    @media (min-width: 1280px) {
      .read-status { left: auto; right: 80px; bottom: 34px; transform: none; }
    }

    /* "Continue where you left off" */
    .resume-toast {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      z-index: var(--z-drawer);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(560px, calc(100vw - 32px));
      padding: 8px 8px 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      font: 14px/1.4 var(--font-sans);
      color: var(--text);
    }
    .resume-toast[hidden] { display: none; }
    .resume-toast .resume-where { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
    .resume-toast .resume-go {
      flex-shrink: 0;
      height: 34px;
      padding: 0 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent-fill);
      color: var(--accent-on);
      font: 600 14px var(--font-sans);
      cursor: pointer;
    }
    .resume-toast .resume-close {
      flex-shrink: 0;
      width: 34px; height: 34px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: var(--text-subtle);
      border-radius: var(--radius-sm); cursor: pointer; padding: 0;
    }
    .resume-toast .resume-close .icon { width: 16px; height: 16px; stroke-width: 2; }

    /* ============================================================
       PRINT
       ============================================================ */
    @media print {
      html { font-size: 100% !important; }
      .topbar, .toc, .toc-backdrop, .icon-btn, .text-btn, .copy-btn, .anchor, .scroll-progress, .back-to-top, .section-jump, .read-status, .resume-toast, .popover { display: none !important; }
      .layout { grid-template-columns: 1fr; padding: 0; max-width: 100%; }
      body { background: #fff; color: #000; }
      body.guest-only .step.speaker-host { display: grid; }
      a { color: #000; }
      .content pre, .callout, .compare-card, .step, .diagram { break-inside: avoid; }
      .doc-footer { break-before: avoid; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <button class="icon-btn toc-mobile-trigger" id="toc-toggle" onclick="openToc()" aria-label="目录" title="目录">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
        <span class="brand-dot" aria-hidden="true"></span>
        <span>笔记</span>
      </div>
      <div class="topbar-actions">
        <button class="text-btn" id="skim-toggle" type="button" aria-pressed="true" title="展开全部对谈实录" hidden>只看要点</button>
        <button class="text-btn" id="guest-only-toggle" type="button" aria-pressed="false" title="隐藏主持人的发言，只读嘉宾原声" hidden>只看嘉宾</button>
        <div class="font-scale" role="group" aria-label="字号">
          <button class="icon-btn font-btn" id="font-down" data-fs="down" type="button" onclick="stepFontScale(-1)" title="缩小字号" aria-label="缩小字号">A−</button>
          <button class="icon-btn font-btn font-reset" id="font-reset" data-fs="reset" type="button" onclick="setFontScale(1)" title="恢复默认字号" aria-label="恢复默认字号">100%</button>
          <button class="icon-btn font-btn" id="font-up" data-fs="up" type="button" onclick="stepFontScale(1)" title="放大字号" aria-label="放大字号">A+</button>
        </div>
        <button class="icon-btn" id="theme-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu" title="主题" aria-label="主题">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use id="theme-icon" href="#i-glasses"/></svg>
        </button>
        <button class="icon-btn settings-btn" id="settings-toggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-panel" title="排版设置" aria-label="排版设置"><span class="aa" aria-hidden="true">Aa</span></button>
      </div>
    </div>
  </header>

  <!-- Popovers sit outside the topbar, whose backdrop-filter would trap position: fixed -->
  <div class="popover theme-menu" id="theme-menu" role="menu" aria-label="主题" hidden>
    <button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="sepia"><span class="swatch swatch-sepia">文</span>护眼<span class="tm-hint">米黄纸色，默认</span></button>
    <button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="reader"><span class="swatch swatch-reader">文</span>阅读<span class="tm-hint">屏幕上模拟纸书</span></button>
    <button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="dark"><span class="swatch swatch-dark">文</span>深色<span class="tm-hint">夜间</span></button>

  <div class="popover settings-panel" id="settings-panel" role="dialog" aria-label="排版设置" hidden>
    <div class="set-row set-fs">

    <div class="set-row">
      <span class="set-label">字体</span>
      <div class="seg" role="radiogroup" aria-label="正文字体" data-setting="font">
        <button type="button" role="radio" data-value="" title="跟随主题：阅读用宋体，其余用黑体">默认</button>
        <button type="button" role="radio" data-value="sans">黑体</button>
        <button type="button" role="radio" data-value="serif">宋体</button>
        <button type="button" role="radio" data-value="kai">楷体</button>
      </div>
    </div>
    <div class="set-row">
      <span class="set-label">行距</span>
      <div class="seg" role="radiogroup" aria-label="行距" data-setting="lh">
        <button type="button" role="radio" data-value="tight">紧凑</button>
        <button type="button" role="radio" data-value="">标准</button>
        <button type="button" role="radio" data-value="loose">宽松</button>

    <div class="set-row">
      <span class="set-label">段落</span>
      <div class="seg" role="radiogroup" aria-label="段落样式" data-setting="para">
        <button type="button" role="radio" data-value="">段间空行</button>
        <button type="button" role="radio" data-value="indent">首行缩进</button>

    <div class="set-row">
      <span class="set-label">翻页</span>
      <div class="seg" role="radiogroup" aria-label="翻页方式" data-setting="flip">
        <button type="button" role="radio" data-value="">滚动</button>
        <button type="button" role="radio" data-value="page">整屏翻页</button>

    <div class="set-foot">
      <button type="button" id="settings-reset" title="字体、行距、段落、翻页和字号恢复默认（主题不变）">恢复默认</button>
      <button type="button" onclick="window.print()">打印 / 存 PDF</button>

  </div>

  <!-- TOC drawer backdrop (mobile) -->
  <div class="toc-backdrop" id="toc-backdrop" onclick="closeToc()" aria-hidden="true"></div>

  <div class="layout">
    <aside class="toc" id="toc" aria-label="目录">
      <div class="toc-head">
        <p class="toc-title">目录</p>
        <button class="toc-close" onclick="closeToc()" aria-label="关闭">

        </button>

{{TOC}}
      </nav>
    </aside>

    <main class="content" id="main">
      <header class="doc-header">
        <span class="doc-eyebrow">{{EYEBROW}}</span>
        <h1 class="doc-title">{{TITLE}}</h1>
        <p class="doc-subtitle">{{SUBTITLE}}</p>

            {{META_SOURCE}}
          </span>

            {{META_DATE}}
          </span>
