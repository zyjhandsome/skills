            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-clock"/></svg>
            {{META_READTIME}}
          </span>
        </div>
      </header>

      <!-- CONTENT_START -->
{{CONTENT}}
      <!-- CONTENT_END -->

      <footer class="doc-footer">
        <span>Generated by md2html · <a href="{{SOURCE_URL}}" target="_blank" rel="noopener">观看原视频</a></span>
        <span>来源: {{SOURCE_FILE}}</span>
      </footer>
    </main>
  </div>

  <button type="button" class="back-to-top" id="back-to-top" aria-label="回到顶部" title="回到顶部" hidden>
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow-up"/></svg>
  </button>

  <div class="read-status" id="read-status" aria-hidden="true" hidden></div>
  <div class="resume-toast" id="resume-toast" role="status" hidden>
    <span class="resume-where" id="resume-where"></span>
    <button type="button" class="resume-go" id="resume-go">继续阅读</button>
    <button type="button" class="resume-close" id="resume-close" aria-label="关闭">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>
    </button>
  </div>

  <script type="application/json" id="lecture-header-defaults">{{HEADER_DEFAULTS}}</script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    // ---------- Theme ----------
    const STORAGE_KEY = "md2html-theme";
    const THEMES = { sepia: "护眼", reader: "阅读", dark: "深色" };
    function currentTheme() {
      const theme = document.documentElement.dataset.theme;
      return THEMES[theme] ? theme : "sepia";
    }
    const THEME_ICONS = { sepia: "i-glasses", reader: "i-book", dark: "i-moon" };
    function applyThemeIcon() {
      const theme = currentTheme();
      document.getElementById("theme-icon")?.setAttribute("href", "#" + THEME_ICONS[theme]);
      const btn = document.getElementById("theme-toggle");
      if (btn) { btn.title = "主题：" + THEMES[theme]; btn.setAttribute("aria-label", btn.title); }
      document.querySelectorAll("[data-theme-choice]").forEach(b => {
        b.setAttribute("aria-checked", b.dataset.themeChoice === theme ? "true" : "false");
      });
    }
    // Head script already set data-theme; keep icon + OS-sync in sync here.
    function setTheme(theme, { persist } = { persist: true }) {
      document.documentElement.dataset.theme = theme;
      if (persist) { try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {} }
      applyThemeIcon();
      renderMermaid();
    }
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
      try { if (localStorage.getItem(STORAGE_KEY)) return; } catch (e) {}
      setTheme(e.matches ? "dark" : "sepia", { persist: false });
    });

    // ---------- Mermaid ----------
    const diagramSources = new Map();
    const MERMAID_PALETTES = {
      sepia: { surface: "#F8F2E2", soft: "#EEDCC3", text: "#3B3226", stroke: "#8A4826", s2: "#EEE4CD", s3: "#E7DCC1", line: "#5A4E3E", cluster: "#C8B791" },
      reader: { surface: "#F5F4EF", soft: "#F5F4EF", text: "#262624", stroke: "#474743", s2: "#ECEBE5", s3: "#E4E3DC", line: "#474743", cluster: "#B4B3AB" },
      dark:  { surface: "#221E1A", soft: "#3A2A22", text: "#E3DCD0", stroke: "#D9957A", s2: "#2A2520", s3: "#322C26", line: "#958E84", cluster: "#5A524A" },
    };
    function mermaidThemeVariables(theme) {
      const p = MERMAID_PALETTES[theme] || MERMAID_PALETTES.sepia;
      return {
        darkMode: theme === "dark",
        background: p.surface,
        primaryColor: p.soft,
        primaryTextColor: p.text,
        primaryBorderColor: p.stroke,
        secondaryColor: p.s2,
        tertiaryColor: p.s3,
        lineColor: p.line,
        textColor: p.text,
        mainBkg: p.soft,
        nodeBorder: p.stroke,
        clusterBkg: p.s2,
        clusterBorder: p.cluster,
        titleColor: p.text,
        edgeLabelBackground: p.surface,
        fontFamily: "-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif",
      };
    }
    function initMermaid() {
      mermaid.initialize({
        startOnLoad: false,
        theme: "base",
        themeVariables: mermaidThemeVariables(currentTheme()),
      });
    }
    // Plain-text rendering of a small flowchart for when the CDN did not load:
    // node ids are replaced by their labels, each edge becomes one "A → B" line
    // (dotted edges become "A ⇢（label）B").
    function mermaidTextFallback(src) {
      const labels = {};
      src.replace(/(\w+)\[\s*"?([^\]"]+?)"?\s*\]/g, (m, id, label) => { labels[id] = label; return m; });
      const lines = [];
      src.split("\n").forEach(line => {
        const m = line.match(/^\s*(\w+)(?:\[[^\]]*\])?\s*(-->|-\.\s*([^.]*?)\s*\.->|-\.->)\s*(\w+)(?:\[[^\]]*\])?/);
        if (!m) return;
        const arrow = m[2] === "-->" ? " → " : (m[3] ? ` ⇢（${m[3]}）` : " ⇢ ");
        lines.push((labels[m[1]] || m[1]) + arrow + (labels[m[4]] || m[4]));
      });
      return lines.join("\n");
    }
    async function renderMermaid() {
      const els = document.querySelectorAll(".mermaid");
      els.forEach(el => {
        if (!diagramSources.has(el)) diagramSources.set(el, el.textContent.trim());
      });
      if (typeof mermaid === "undefined") {
        els.forEach(el => {
          const text = mermaidTextFallback(diagramSources.get(el));
          if (text) { el.textContent = text; el.classList.add("mermaid-fallback"); }
        });
        return;
      }
      initMermaid();
      els.forEach(el => {
        el.textContent = diagramSources.get(el);
        el.removeAttribute("data-processed");
      });
      try { await mermaid.run({ nodes: els }); } catch (e) { console.error(e); }
    }
    // ---------- Popovers: theme menu + 「Aa」 typesetting ----------
    // Global like theme and font scale (reader preferences, not per-note state).
    // Each typesetting choice is a data-* attribute on <html>; the head script
    // restores them before first paint. Empty value = default = attribute removed.
    const SETTINGS_KEY = "md2html-read-settings";
    let panelClosedAt = -1;   // the click that closes a popover must not also turn a page
    const SETTING_NAMES = ["font", "lh", "para", "flip"];
    const POPOVERS = [["theme-toggle", "theme-menu"], ["settings-toggle", "settings-panel"]];
    const settingsPanel = () => document.getElementById("settings-panel");
    const anyPopoverOpen = () => POPOVERS.some(([, id]) => document.getElementById(id)?.hidden === false);
    function readSettings() {
      try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") || {}; } catch (e) { return {}; }
    }
    function syncSettingButtons() {
      document.querySelectorAll(".seg[data-setting]").forEach(group => {
        const value = document.documentElement.getAttribute("data-" + group.dataset.setting) || "";
        group.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", b.dataset.value === value ? "true" : "false"));
      });
      const hint = document.getElementById("flip-hint");
      if (hint) hint.hidden = document.documentElement.dataset.flip !== "page";
    }
    function applySetting(name, value) {
      const root = document.documentElement;
      // Keep the paragraph being read in place across the reflow (same as A−/A+).
      const anchor = document.elementFromPoint(window.innerWidth / 2, Math.min(160, window.innerHeight / 3));
      const before = anchor ? anchor.getBoundingClientRect().top : 0;
      root.style.overflowAnchor = "none";
      if (value) root.setAttribute("data-" + name, value); else root.removeAttribute("data-" + name);
      if (anchor && !anchor.closest(".popover")) {
        window.scrollTo({ top: window.scrollY + anchor.getBoundingClientRect().top - before, behavior: "instant" });
      }
      requestAnimationFrame(() => { root.style.overflowAnchor = ""; });
      const all = readSettings();
      if (value) all[name] = value; else delete all[name];
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(all)); } catch (e) {}
      syncSettingButtons();
    }
    function setPopoverOpen(id, open) {
      const pair = POPOVERS.find(([, p]) => p === id);
      const pop = document.getElementById(id);
      const btn = pair && document.getElementById(pair[0]);
      if (!pop || !btn) return;
      if (open) POPOVERS.forEach(([, other]) => { if (other !== id) setPopoverOpen(other, false); });
      pop.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (!open) return;
      document.body.classList.remove("chrome-hidden");
      const r = btn.getBoundingClientRect();
      pop.style.top = Math.round(r.bottom + 8) + "px";
      pop.style.right = Math.max(8, Math.round(window.innerWidth - r.right)) + "px";
      (pop.querySelector('[aria-checked="true"]') || pop.querySelector("button"))?.focus({ preventScroll: true });
    }
    const setSettingsOpen = open => setPopoverOpen("settings-panel", open);
    function setupSettings() {
      syncSettingButtons();
      POPOVERS.forEach(([btnId, id]) => {
        const btn = document.getElementById(btnId);
        const pop = document.getElementById(id);
        if (!btn || !pop) return;
        btn.addEventListener("click", () => setPopoverOpen(id, pop.hidden));
        // Escape closes and returns focus; arrows move within a radio group / the menu.
        pop.addEventListener("keydown", e => {
          if (e.key === "Escape") { setPopoverOpen(id, false); btn.focus(); return; }
          const vertical = pop.getAttribute("role") === "menu";
          const keys = vertical ? ["ArrowUp", "ArrowDown"] : ["ArrowLeft", "ArrowRight"];
          if (!keys.includes(e.key)) return;
          const group = vertical ? pop : e.target.closest('[role="radiogroup"]');
          if (!group) return;
          const list = Array.from(group.querySelectorAll("button"));
          const i = list.indexOf(e.target);
          if (i < 0) return;
          e.preventDefault();
          e.stopPropagation();
          list[(i + (e.key === keys[1] ? 1 : -1) + list.length) % list.length].focus();
        });
      });
      document.getElementById("theme-menu")?.addEventListener("click", e => {
        const theme = e.target.closest("[data-theme-choice]");
        if (!theme) return;
        setTheme(theme.dataset.themeChoice);
        setPopoverOpen("theme-menu", false);
        document.getElementById("theme-toggle")?.focus({ preventScroll: true });
      });
      settingsPanel()?.addEventListener("click", e => {
        const opt = e.target.closest(".seg[data-setting] button");
        if (opt) applySetting(opt.parentElement.dataset.setting, opt.dataset.value);
      });
      document.getElementById("settings-reset")?.addEventListener("click", () => {
        SETTING_NAMES.forEach(n => applySetting(n, ""));
        setFontScale(1);
      });
      document.addEventListener("click", e => {
        if (!anyPopoverOpen() || e.target.closest(".popover, #theme-toggle, #settings-toggle")) return;
        POPOVERS.forEach(([, id]) => setPopoverOpen(id, false));
        panelClosedAt = e.timeStamp;
      });
      // Width only: mobile URL bars resize the height on every scroll.
      let lastWidth = window.innerWidth;
      window.addEventListener("resize", () => {
        if (window.innerWidth === lastWidth) return;
        lastWidth = window.innerWidth;
        POPOVERS.forEach(([, id]) => setPopoverOpen(id, false));
      });
    }

    // ---------- Font scale (A− / A+) ----------
    // Global like the theme: it is a reader preference, not a per-note state.
    const FONT_SCALE_KEY = "md2html-font-scale";
    const FONT_SCALES = [0.9, 1, 1.1, 1.2, 1.3];
    function currentFontScale() {
      const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs-scale"));
      return FONT_SCALES.includes(v) ? v : 1;
    }
    function syncFontButtons() {
      const scale = currentFontScale();
      // Topbar group on desktop, a copy in the 「Aa」 sheet on phones.
      document.querySelectorAll('[data-fs="down"]').forEach(b => { b.disabled = scale === FONT_SCALES[0]; });
      document.querySelectorAll('[data-fs="up"]').forEach(b => { b.disabled = scale === FONT_SCALES[FONT_SCALES.length - 1]; });
      document.querySelectorAll('[data-fs="reset"]').forEach(b => {
        b.textContent = Math.round(scale * 100) + "%";
        b.disabled = scale === 1;
        b.setAttribute("aria-label", "恢复默认字号（当前 " + b.textContent + "）");
      });
    }
    function stepFontScale(dir) {
      const i = FONT_SCALES.indexOf(currentFontScale());
      setFontScale(FONT_SCALES[Math.min(FONT_SCALES.length - 1, Math.max(0, i + dir))]);
    }
    function setFontScale(next) {
      // Keep the paragraph being read at the same screen position across the reflow.
      // overflow-anchor off, or the browser's own scroll anchoring doubles the correction.
      const root = document.documentElement;
      const anchor = document.elementFromPoint(window.innerWidth / 2, Math.min(160, window.innerHeight / 3));
      const before = anchor ? anchor.getBoundingClientRect().top : 0;
      root.style.overflowAnchor = "none";
      root.style.setProperty("--fs-scale", next);
      try { localStorage.setItem(FONT_SCALE_KEY, String(next)); } catch (e) {}
      if (anchor) window.scrollTo({ top: window.scrollY + anchor.getBoundingClientRect().top - before, behavior: "instant" });
      requestAnimationFrame(() => { root.style.overflowAnchor = ""; });
      syncFontButtons();
    }
    syncFontButtons();

    // ---------- TOC drawer (mobile) ----------
    const tocEl = () => document.getElementById("toc");
    const tocToggle = () => document.getElementById("toc-toggle");
    const isMobileToc = () => window.matchMedia("(max-width: 760px)").matches;

    function syncTocA11y(open) {
      const toc = tocEl();
      if (!toc) return;
      if (isMobileToc()) {
        toc.setAttribute("role", "dialog");
        toc.setAttribute("aria-modal", open ? "true" : "false");
        toc.setAttribute("aria-hidden", open ? "false" : "true");
      } else {
        toc.removeAttribute("role");
        toc.removeAttribute("aria-modal");
        toc.removeAttribute("aria-hidden");
      }
    }

    function openToc() {
      document.body.classList.add("toc-open");
      syncTocA11y(true);
      const closeBtn = tocEl()?.querySelector(".toc-close");
      closeBtn?.focus();
    }
    function closeToc() {
      document.body.classList.remove("toc-open");
      syncTocA11y(false);
      if (isMobileToc()) tocToggle()?.focus();
    }
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && document.body.classList.contains("toc-open")) closeToc();
    });
    window.addEventListener("resize", () => {
      if (!document.body.classList.contains("toc-open")) syncTocA11y(false);
    });

    // ---------- TOC scrollspy ----------
    function setupTocSpy() {
      const links = Array.from(document.querySelectorAll("#toc-nav a[href^='#']"));
      if (!links.length) {
        const toc = document.getElementById("toc");
        if (toc) toc.style.display = "none";
        return;
      }
      const entries = [];
      links.forEach(a => {
        const id = a.getAttribute("href").slice(1);
        const el = document.getElementById(id);
        if (el) entries.push({ el, link: a });
        a.addEventListener("click", () => {
          if (isMobileToc()) closeToc();
        });
      });

      let ticking = false;
      const setActive = () => {
        ticking = false;
        const offset = 96;
        let current = entries[0]?.link;
        for (const { el, link } of entries) {
          if (el.getBoundingClientRect().top <= offset) current = link;
        }
        links.forEach(l => l.classList.toggle("active", l === current));
        // Keep the active entry inside the TOC's own viewport (scrolls the TOC only).
        const toc = document.getElementById("toc");
        if (current && toc && !isMobileToc() && toc.scrollHeight > toc.clientHeight) {
          const lt = current.getBoundingClientRect().top - toc.getBoundingClientRect().top + toc.scrollTop;
          const lb = lt + current.offsetHeight;
          if (lt < toc.scrollTop) toc.scrollTop = lt - 8;
          else if (lb > toc.scrollTop + toc.clientHeight) toc.scrollTop = lb - toc.clientHeight + 8;
        }
      };
      const onScroll = () => {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(setActive);
        }
      };
      window.addEventListener("scroll", onScroll, { passive: true });
      setActive();
    }

    // ---------- Section jump pills ----------
    function injectSectionJumps() {
      document.querySelectorAll(".content h2[id]").forEach(h2 => {
        const id = h2.id;
        const parts = [
          { suffix: "-insight", label: "洞察" },
          { suffix: "-analysis", label: "解析" },
          { suffix: "-dialogue", label: "实录" },
        ];
        const items = parts
          .map(p => ({ el: document.getElementById(id + p.suffix), label: p.label }))
          .filter(x => x.el);
        if (!items.length) return;
        const nav = document.createElement("nav");
        nav.className = "section-jump";
        nav.setAttribute("aria-label", "本节导航");
        items.forEach(({ el, label }) => {
          const a = document.createElement("a");
          a.href = "#" + el.id;
          a.textContent = label;
          nav.appendChild(a);
        });
        h2.insertAdjacentElement("afterend", nav);
      });
    }

    // ---------- 只看要点: fold every dialogue layer, keep reading position ----------
    // Per note: local files share one storage origin, and a global key made
    // every other note open already folded.
    const SKIM_KEY = "md2html-skim:" + location.pathname;
    function setupSkim() {
      const btn = document.getElementById("skim-toggle");
      const folds = Array.from(document.querySelectorAll("details.dialogue-fold"));
      if (!btn || !folds.length) return;
      btn.hidden = false;
      const apply = (on, keepPlace) => {
        const anchor = keepPlace
          ? Array.from(document.querySelectorAll(".content h2")).find(h => h.getBoundingClientRect().bottom > 80)
          : null;
        const before = anchor ? anchor.getBoundingClientRect().top : 0;
        // Browser scroll anchoring would compensate too, doubling the correction.
        const root = document.documentElement;
        root.style.overflowAnchor = "none";
        folds.forEach(d => { d.open = !on; });
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        btn.title = on ? "展开全部对谈实录" : "折叠全部对谈实录，只读洞察与解析";
        if (anchor) {
          window.scrollTo({ top: window.scrollY + anchor.getBoundingClientRect().top - before, behavior: "instant" });
        }
        requestAnimationFrame(() => { root.style.overflowAnchor = ""; });
      };
      btn.addEventListener("click", () => {
        const on = btn.getAttribute("aria-pressed") !== "true";
        try { localStorage.setItem(SKIM_KEY, on ? "1" : "0"); } catch (e) {}
        apply(on, true);
      });
      let saved = null;
      try { saved = localStorage.getItem(SKIM_KEY); } catch (e) {}
      if (saved === "1") apply(true, false);
      else if (saved === "0") apply(false, false);
    }

    // ---------- 只看嘉宾: hide host turns inside 对谈实录 ----------
    // Shown only when the note has a host-colored speaker. Per-note key, like skim.
    const GUEST_KEY = "md2html-guest-only:" + location.pathname;
    function setupGuestOnly() {
      const btn = document.getElementById("guest-only-toggle");
      if (!btn || !document.querySelector(".step.speaker-host")) return;
      btn.hidden = false;
      const apply = (on) => {
        document.body.classList.toggle("guest-only", on);
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        btn.title = on ? "恢复显示主持人的发言" : "隐藏主持人的发言，只读嘉宾原声";
      };
      btn.addEventListener("click", () => {
        const on = btn.getAttribute("aria-pressed") !== "true";
        try { localStorage.setItem(GUEST_KEY, on ? "1" : "0"); } catch (e) {}
        apply(on);
      });
      let saved = null;
      try { saved = localStorage.getItem(GUEST_KEY); } catch (e) {}
      apply(saved === "1");
    }

    // ---------- Print: expand collapsed panels, restore afterwards ----------
    function setupPrintExpand() {
      let reopened = [];
      window.addEventListener("beforeprint", () => {
        reopened = Array.from(document.querySelectorAll("details:not([open])"));
        reopened.forEach(d => { d.open = true; });
      });
      window.addEventListener("afterprint", () => {
        reopened.forEach(d => { d.open = false; });
        reopened = [];
      });
    }

    // ---------- Anchor links on h2/h3 ----------
    function injectAnchors() {
      document.querySelectorAll(".content h2[id], .content h3[id]").forEach(h => {
        if (h.querySelector(".anchor")) return;
        const a = document.createElement("a");
        a.className = "anchor";
        a.href = "#" + h.id;
        a.setAttribute("aria-label", "段落链接");
        a.innerHTML = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-link"/></svg>';
        h.appendChild(a);
      });
    }

    // ---------- Copy-to-clipboard on <pre> ----------
    function injectCopyButtons() {
      document.querySelectorAll(".content pre").forEach(pre => {
        if (pre.classList.contains("mermaid")) return;
        if (pre.querySelector(".copy-btn")) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "copy-btn";
        btn.setAttribute("aria-label", "复制代码");
        btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-copy"/></svg>';
        btn.addEventListener("click", async () => {
          const code = pre.querySelector("code")?.textContent ?? pre.textContent;
          try {
            await navigator.clipboard.writeText(code);
            btn.classList.add("copied");
            btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg>';
            setTimeout(() => {
              btn.classList.remove("copied");
              btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-copy"/></svg>';
            }, 1500);
          } catch (e) { console.error(e); }
        });
        pre.appendChild(btn);
      });
    }

    // ---------- Back to top ----------
    function setupBackToTop() {
      const btn = document.getElementById("back-to-top");
      if (!btn) return;
      const toggle = () => {
        btn.hidden = window.scrollY < 480;
      };
      btn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      window.addEventListener("scroll", toggle, { passive: true });
      toggle();
    }

    // ---------- Scroll progress ----------
    function setupScrollProgress() {
      const bar = document.getElementById("scroll-progress");
      if (!bar) return;
      const onScroll = () => {
        const h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const p = h > 0 ? (document.documentElement.scrollTop / h * 100) : 0;
        bar.style.width = p + "%";
      };
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();
    }

    // ---------- Reading: blocks, time left, resume, immersive chrome ----------
    // One ordered list of readable leaf blocks drives all three features.
    // Same pace as the header's estimate (build_html.py: 300 CJK chars/min).
    const CJK_PER_MIN = 300;
    const POS_KEY = "md2html-pos:" + location.pathname;
    const READ_LINE = 96;   // px below the viewport top that counts as "being read"
    function setupReading() {
      const content = document.getElementById("main");
      if (!content) return;
      const blocks = Array.from(content.querySelectorAll("h2, h3, p, li, pre, figure, tr"))
        .filter(el => !el.closest(".doc-header, .doc-footer, li p, figure pre") && !(el.tagName === "LI" && el.querySelector("p")))
        .map(el => {
          const h2 = el.tagName === "H2" ? el : null;
          return { el, h2, cjk: (el.textContent.match(/[\u4e00-\u9fff]/g) || []).length };
        });
      let section = null;
      blocks.forEach(b => { if (b.h2) section = b.h2; b.section = section; });
      const statusEl = document.getElementById("read-status");

      // Visible blocks change when folds open/close or 只看嘉宾 hides turns.
      let visible = null;
      const getVisible = () => visible || (visible = blocks.filter(b => b.el.getClientRects().length));
      const invalidate = () => { visible = null; schedule(); };
      document.addEventListener("toggle", invalidate, true);
      let guestOnly = document.body.classList.contains("guest-only");
      new MutationObserver(() => {
        const now = document.body.classList.contains("guest-only");
        if (now !== guestOnly) { guestOnly = now; invalidate(); }
      }).observe(document.body, { attributes: true, attributeFilter: ["class"] });

      const currentIndex = (list) => {
        let lo = 0, hi = list.length - 1, ans = list.length - 1;
        while (lo <= hi) {
          const mid = (lo + hi) >> 1;
          if (list[mid].el.getBoundingClientRect().bottom > READ_LINE) { ans = mid; hi = mid - 1; } else lo = mid + 1;
        }
        return ans;
      };
      const sectionLabel = (h2) => {
        if (!h2) return "";
        const secs = Array.from(content.querySelectorAll("h2.sec"));
        const n = secs.indexOf(h2);
        const title = (h2.firstChild && h2.firstChild.nodeType === 3 ? h2.firstChild.textContent : h2.textContent).trim();
        return (n >= 0 ? String(n + 1).padStart(2, "0") + " " : "") + title;
      };

      // --- time left in this section · share of the note ---
      const updateStatus = (list, i) => {
        if (!statusEl) return;
        const cur = list[i];
        if (!cur || window.scrollY < 400 || !cur.section) { statusEl.hidden = true; return; }
        let total = 0, before = 0, left = 0;
        list.forEach((b, k) => {
          total += b.cjk;
          if (k < i) before += b.cjk;
          else if (b.section === cur.section) left += b.cjk;
        });
        const min = Math.round(left / CJK_PER_MIN);
        const pct = total ? Math.round(before / total * 100) : 0;
        const text = (min < 1 ? "本节即将读完" : "本节剩余约 " + min + " 分钟") + " · 全文 " + pct + "%";
        if (statusEl.textContent !== text) statusEl.textContent = text;   // e-ink: repaint only on change
        statusEl.hidden = false;
      };

      // --- remember where the reader is (per note) ---
      // Only after the reader scrolls: the first paint sits at the top and
      // would erase the position before the resume offer is answered.
      let saveTimer = 0, scrolled = false;
      const savePosition = (list, i) => {
        if (!scrolled) return;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          try {
            const cur = list[i];
            if (window.scrollY < 400 || !cur) { localStorage.removeItem(POS_KEY); return; }
            localStorage.setItem(POS_KEY, JSON.stringify({
              i: blocks.indexOf(cur),
              snippet: cur.el.textContent.trim().slice(0, 24),
              sec: cur.section ? cur.section.id : "",
              at: Date.now(),
            }));
          } catch (e) {}
        }, 400);
      };

      // --- immersive: hide the topbar on the way down, bring it back on the way up ---
      let lastY = window.scrollY;
      const updateChrome = () => {
        const y = window.scrollY, dy = y - lastY;
        lastY = y;
        const busy = document.body.classList.contains("toc-open") || anyPopoverOpen()
          || !!document.querySelector(".topbar :focus-visible");   // keyboard focus only; a clicked button keeps focus too
        if (y < 240 || busy) document.body.classList.remove("chrome-hidden");
        else if (isPaging()) document.body.classList.add("chrome-hidden");   // paging: menu only when the pointer is at the top
        else if (dy < -6) document.body.classList.remove("chrome-hidden");
        else if (dy > 6) document.body.classList.add("chrome-hidden");
      };
      document.addEventListener("mousemove", e => {
        if (e.clientY < 64) document.body.classList.remove("chrome-hidden");
      }, { passive: true });

      // --- 整屏翻页: Kindle-style page turns (no smooth scroll: e-ink ghosting) ---
      const isPaging = () => document.documentElement.dataset.flip === "page";
      const PAGE_TOP = 12;   // chrome is hidden while paging
      // The text line box at a viewport point, or null over images/whitespace.
      const overlays = () => document.querySelectorAll(".topbar, .read-status, .resume-toast, .back-to-top");
      const lineRectAt = (x, y) => {
        let node = null, offset = 0;
        // The topbar may still be sliding away; overlays must not swallow the hit test.
        overlays().forEach(el => { el.style.pointerEvents = "none"; });
        if (document.caretPositionFromPoint) {
          const pos = document.caretPositionFromPoint(x, y);
          if (pos) { node = pos.offsetNode; offset = pos.offset; }
        } else if (document.caretRangeFromPoint) {
          const r = document.caretRangeFromPoint(x, y);
          if (r) { node = r.startContainer; offset = r.startOffset; }
        }
        overlays().forEach(el => { el.style.pointerEvents = ""; });
        if (!node || node.nodeType !== 3 || !content.contains(node) || !node.length) return null;
        const range = document.createRange();
        const start = Math.min(offset, node.length - 1);
        range.setStart(node, start);
        range.setEnd(node, start + 1);
        const rect = range.getClientRects()[0];
        return rect && rect.height ? rect : null;
      };
      function turnPage(dir) {
        const vh = window.innerHeight;
        const lh = parseFloat(getComputedStyle(document.body).lineHeight) || 30;
        const col = content.getBoundingClientRect();
        const x = col.left + col.width / 2;
        const fallback = dir * (vh - PAGE_TOP - 2 * lh);
        let delta = fallback;
        if (dir > 0) {
          // The line cut by the bottom edge opens the next page; a fully visible one stays behind.
          // Probe at the very edge: a caret that snaps out of a gap still picks a correct boundary.
          const r = lineRectAt(x, vh - 2);
          if (r) delta = r.bottom <= vh ? r.bottom : r.top - PAGE_TOP;
        } else {
          // Mirror: the line cut by the top edge closes the previous page.
          const r = lineRectAt(x, 2);
          if (r) delta = (r.top >= 0 ? r.top : r.bottom) - vh;
        }
        if (Math.abs(delta) < vh * 0.5) delta = fallback;   // a stray caret must not stall the turn
        delta = Math.max(-vh, Math.min(vh, delta));          // never skip unseen pixels
        window.scrollTo({ top: Math.max(0, window.scrollY + delta), behavior: "instant" });
        if (window.scrollY >= 240) document.body.classList.add("chrome-hidden");
      }
      // Clicks never turn the page: a reader selecting or just clicking the text
      // was constantly sent to the next screen. Keyboard only, and only after
      // the reader opts into 整屏翻页 (the default stays scroll).
      document.addEventListener("keydown", e => {
        if (!isPaging() || e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.target.closest?.("input, textarea, select, [contenteditable], .popover")) return;
        if (document.body.classList.contains("toc-open")) return;
        const next = e.key === "PageDown" || e.key === "ArrowRight" || (e.key === " " && !e.shiftKey);
        const prev = e.key === "PageUp" || e.key === "ArrowLeft" || (e.key === " " && e.shiftKey);
        if (!next && !prev) return;
        if (e.key === " " && e.target.closest?.("button, summary, a")) return;   // Space activates the focused control
        e.preventDefault();
        turnPage(next ? 1 : -1);
      });

      let ticking = false;
      function update() {
        ticking = false;
        const list = getVisible();
        const i = currentIndex(list);
        updateStatus(list, i);
        savePosition(list, i);
      }
      function schedule() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
      window.addEventListener("scroll", () => { scrolled = true; updateChrome(); schedule(); }, { passive: true });
      window.addEventListener("resize", invalidate);
      schedule();

      // --- offer to resume (after load, once the browser's own scroll restore has run) ---
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(POS_KEY) || "null"); } catch (e) {}
      const toast = document.getElementById("resume-toast");
      if (!saved || !toast || location.hash) return;
      const hit = (() => {
        const byIndex = blocks[saved.i];
        if (byIndex && byIndex.el.textContent.trim().startsWith(saved.snippet)) return byIndex;
        return blocks.find(b => saved.snippet && b.el.textContent.trim().startsWith(saved.snippet))
          || blocks.find(b => b.h2 && b.h2.id === saved.sec);
      })();
      if (!hit) return;
      const offer = () => {
        const r = hit.el.getBoundingClientRect();
        if (hit.el.getClientRects().length && r.top > 0 && r.top < window.innerHeight) return;   // already there
        document.getElementById("resume-where").textContent = "上次读到：" + (sectionLabel(hit.section) || hit.el.textContent.trim().slice(0, 20));
        toast.hidden = false;
        const close = () => { toast.hidden = true; clearTimeout(autoClose); };
        const autoClose = setTimeout(close, 12000);
        document.getElementById("resume-close").addEventListener("click", close);
        document.getElementById("resume-go").addEventListener("click", () => {
          close();
          const fold = hit.el.closest("details:not([open])");
          if (fold) fold.open = true;
          const top = hit.el.getBoundingClientRect().top + window.scrollY - READ_LINE + 8;
          window.scrollTo({ top, behavior: "instant" });
        });
      };
      if (document.readyState === "complete") setTimeout(offer, 50);
      else window.addEventListener("load", () => setTimeout(offer, 50), { once: true });
    }

    // ---------- Boot ----------
    document.addEventListener("DOMContentLoaded", () => {
      applyThemeIcon();
      syncTocA11y(false);
      setupPrintExpand();
      setupSkim();
      setupGuestOnly();
      injectAnchors();
      injectCopyButtons();
      renderMermaid();
      setupTocSpy();
      setupScrollProgress();
      setupBackToTop();
      setupSettings();
      setupReading();
    });
  </script>
</body>
</html>
