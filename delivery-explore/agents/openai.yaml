interface:
  display_name: "Delivery Explore"
  short_description: "Map grounded directions and align on one before framing"
  default_prompt: >
    Use $delivery-explore for the informal direction-alignment stage. Ground
    every direction in codebase evidence, help the user pick one, and pass
    quality_signals as non-authoritative hints for Frame to recompute. Do not
    create OpenSpec state or implementation approval.
