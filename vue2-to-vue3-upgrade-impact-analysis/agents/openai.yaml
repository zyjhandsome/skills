interface:
  display_name: "Vue 2 → Vue 3 Upgrade Impact Analysis"
  short_description: "Independent Vue2→Vue3 impact analysis and compact outputs"
  default_prompt: >
    Use $vue2-to-vue3-upgrade-impact-analysis when the user names this skill
    or asks for Vue 2 to Vue 3 upgrade impact analysis, a multi-repo inventory,
    an A→B host-port path, or a residual audit of a workspace that is already
    on Vue 3. Always read SKILL.md first and follow its entry kinds, staged
    reference loads, confirmation gates, and --output-dir rule. An explicit
    --output-dir is confirmation; do not ask for that path again. Analysis
    only — no install, codemod, or source edits. Name migration recipes, never
    run them. Return upgrade-summary.json by default.
