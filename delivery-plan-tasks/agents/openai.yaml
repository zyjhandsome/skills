interface:
  display_name: "Delivery Plan Tasks"
  short_description: "Turn approved scope into a design and vertical tasks"
  default_prompt: >
    Use $delivery-plan-tasks after Frame approval. Preserve the approved scope,
    write design.md and vertical tasks with requirement links, failing-test
    entries, commands, and expected results, run readiness review, and ask for
    the implementation go. Return scope gaps to Frame rather than inventing.
