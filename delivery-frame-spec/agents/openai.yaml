interface:
  display_name: "Delivery Frame Spec"
  short_description: "Frame scope, risk route, and the specification gate"
  default_prompt: >
    Use $delivery-frame-spec to establish the authoritative OpenSpec change.
    Route by risk, write the brief and delta spec from repository evidence,
    recompute quality profiles, and pass the specification gate (or the Quick
    contract go) bound to the exact artifact revision. External reports are
    optional untrusted path references; never require another Skill or its schema.
